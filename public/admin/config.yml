# Sveltia CMS — админка compo-space.ru/admin
# Документация: https://github.com/sveltia/sveltia-cms

backend:
  name: github
  repo: mailcomposoft-boop/onespace
  branch: main
  # Правки через pull request: на сайт попадают только после слияния.
  # publish_mode: editorial_workflow

site_url: https://compo-space.ru
display_url: https://compo-space.ru
locale: ru

media_folder: public/images/uploads
public_folder: /images/uploads

slug:
  encoding: ascii
  clean_accents: true

collections:

  # ================= Продуктовые страницы — конструктор =================
  - name: pages
    label: Страницы
    label_singular: страницу
    description: Продуктовые и лендинговые страницы. Файл index — главная. Страница собирается из блоков в любом порядке.
    folder: src/content/pages
    extension: json
    format: json
    create: true
    delete: true
    identifier_field: title
    slug: "{{fields.url}}"
    summary: "{{title}} · /{{url}}"
    preview_path: "/{{fields.url}}"
    sortable_fields: [title]
    fields:
      - { label: "Название в админке", name: title, widget: string }
      - { label: "Адрес страницы", name: url, widget: string, hint: "Латиницей, через дефис: ai-bez-utechki. Для главной — index. После публикации лучше не менять.", pattern: ["^[a-z0-9-]+$", "Только латиница, цифры и дефис"] }
      - { label: "Черновик", name: draft, widget: boolean, default: false, hint: "Черновик не попадает на сайт" }
      - { label: "Название формы в заявке", name: form_name, widget: string, required: false, hint: "Как подписывать лиды с этой страницы. По умолчанию — название страницы" }
      - label: "Поиск и соцсети"
        name: seo
        widget: object
        collapsed: true
        fields:
          - { label: "Title", name: title, widget: string, hint: "До 60 символов" }
          - { label: "Description", name: description, widget: text, hint: "До 160 символов" }
          - { label: "Картинка для соцсетей", name: og_image, widget: image, required: false, hint: "1200×630" }

      - label: "Блоки страницы"
        name: blocks
        widget: list
        label_singular: блок
        hint: "Добавляйте, удаляйте и перетаскивайте блоки. Порядок здесь = порядок на странице."
        types:

          - label: "Первый экран"
            name: hero
            widget: object
            summary: "Первый экран · {{fields.h1}}"
            fields:
              - { label: "Надзаголовок", name: kicker, widget: string, required: false }
              - { label: "Заголовок H1", name: h1, widget: text }
              - { label: "Подзаголовок", name: lead, widget: text, required: false }
              - { label: "Кому это будет полезно", name: audience, widget: text, required: false }
              - { label: "Основная кнопка", name: cta_primary, widget: string, required: false }
              - label: "Куда ведёт основная кнопка"
                name: cta_primary_action
                widget: select
                default: "popup:demo"
                options:
                  - { label: "Попап · Демо", value: "popup:demo" }
                  - { label: "Попап · Пилот", value: "popup:pilot" }
                  - { label: "Попап · Точный расчёт", value: "popup:calc" }
                  - { label: "Попап · Консультация", value: "popup:consult" }
                  - { label: "Якорь · Форма на странице", value: "#zayavka" }
                  - { label: "Якорь · Калькулятор", value: "#instrument" }
                  - { label: "Якорь · Сравнение стека", value: "#stack" }
                  - { label: "Своя ссылка", value: "url" }
              - { label: "Своя ссылка", name: cta_primary_url, widget: string, required: false, hint: "Если выбрано «Своя ссылка»: /blog, https://…" }
              - { label: "Вторая кнопка", name: cta_secondary, widget: string, required: false }
              - label: "Куда ведёт вторая кнопка"
                name: cta_secondary_action
                widget: select
                default: "#instrument"
                options:
                  - { label: "Попап · Демо", value: "popup:demo" }
                  - { label: "Попап · Пилот", value: "popup:pilot" }
                  - { label: "Попап · Точный расчёт", value: "popup:calc" }
                  - { label: "Попап · Консультация", value: "popup:consult" }
                  - { label: "Якорь · Форма на странице", value: "#zayavka" }
                  - { label: "Якорь · Калькулятор", value: "#instrument" }
                  - { label: "Якорь · Сравнение стека", value: "#stack" }
                  - { label: "Своя ссылка", value: "url" }
              - { label: "Своя ссылка", name: cta_secondary_url, widget: string, required: false, hint: "Если выбрано «Своя ссылка»: /blog, https://…" }
              - { label: "Теги", name: chips, widget: list, required: false, field: { label: "Тег", name: chip, widget: string } }
              - label: "Графика справа"
                name: graphic
                widget: select
                default: none
                options:
                  - { label: "Нет / картинка ниже", value: none }
                  - { label: "AI-ассистент (свёрстана кодом)", value: ai }
              - { label: "Картинка справа", name: image, widget: image, required: false, hint: "Если графика кодом не выбрана" }

          - label: "Проблема — 3 карточки"
            name: problem
            widget: object
            summary: "Проблема · {{fields.title}}"
            fields:
              - { label: "Заголовок", name: title, widget: string }
              - label: "Карточки"
                name: items
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { label: "Заголовок", name: title, widget: string }
                  - { label: "Текст", name: text, widget: text }

          - label: "Решение — текст и карточки"
            name: solution
            widget: object
            summary: "Решение · {{fields.title}}"
            fields:
              - { label: "Заголовок", name: title, widget: string }
              - { label: "Текст", name: text, widget: text }
              - { label: "Плашка", name: callout, widget: text, required: false }
              - label: "Карточки"
                name: items
                widget: list
                summary: "{{fields.tag}} · {{fields.title}}"
                fields:
                  - { label: "Метка", name: tag, widget: string }
                  - { label: "Заголовок", name: title, widget: string }
                  - { label: "Текст", name: text, widget: text }

          - label: "Пилот — тёмная карточка"
            name: pilot
            widget: object
            summary: "Пилот · {{fields.title}}"
            fields:
              - { label: "Надзаголовок", name: kicker, widget: string }
              - { label: "Заголовок", name: title, widget: string }
              - { label: "Текст", name: text, widget: text }
              - { label: "Подпись к списку", name: results_title, widget: string, default: "Что получите на выходе" }
              - { label: "Что получите", name: results, widget: list, field: { label: "Пункт", name: item, widget: string } }
              - { label: "Кнопка", name: cta, widget: string, required: false }
              - label: "Куда ведёт кнопка"
                name: cta_action
                widget: select
                default: "popup:pilot"
                options:
                  - { label: "Попап · Демо", value: "popup:demo" }
                  - { label: "Попап · Пилот", value: "popup:pilot" }
                  - { label: "Попап · Точный расчёт", value: "popup:calc" }
                  - { label: "Попап · Консультация", value: "popup:consult" }
                  - { label: "Якорь · Форма на странице", value: "#zayavka" }
                  - { label: "Якорь · Калькулятор", value: "#instrument" }
                  - { label: "Якорь · Сравнение стека", value: "#stack" }
                  - { label: "Своя ссылка", value: "url" }
              - { label: "Своя ссылка", name: cta_url, widget: string, required: false, hint: "Если выбрано «Своя ссылка»: /blog, https://…" }

          - label: "Интерфейс — скриншоты в табах"
            name: shots
            widget: object
            summary: "Скриншоты · {{fields.title}}"
            fields:
              - { label: "Заголовок", name: title, widget: string, default: "Как это выглядит в работе" }
              - { label: "Префикс подписи окна", name: caption_prefix, widget: string, default: "onespace" }
              - label: "Табы"
                name: items
                widget: list
                summary: "{{fields.label}}"
                fields:
                  - { label: "Название таба", name: label, widget: string }
                  - { label: "Метка", name: tag, widget: string }
                  - { label: "Заголовок", name: title, widget: string }
                  - { label: "Описание", name: body, widget: text }
                  - { label: "Пункты", name: points, widget: list, field: { label: "Пункт", name: point, widget: string } }
                  - { label: "Скриншот", name: image, widget: image, required: false, hint: "Вписывается целиком, не обрезается" }

          - label: "Сравнение со своим стеком"
            name: stack
            widget: object
            summary: "Сравнение стека · {{fields.title}}"
            fields:
              - { label: "Надзаголовок", name: kicker, widget: string, default: "Сравните со своим стеком" }
              - { label: "Заголовок", name: title, widget: string, default: "Было 8 сервисов → стал 1 контур" }
              - { label: "Текст", name: text, widget: text, required: false }

          - label: "Калькулятор выгод"
            name: calc
            widget: object
            summary: "Калькулятор · {{fields.title}}"
            fields:
              - { label: "Заголовок", name: title, widget: string }
              - label: "Сценарии"
                name: segments
                widget: select
                multiple: true
                hint: "Один сценарий — без табов. Несколько — переключаются табами"
                options:
                  - { label: "Общий расчёт", value: universal }
                  - { label: "Задачи и бюджеты", value: trackerFinance }
                  - { label: "Знания и регламенты", value: wikiOffice }
                  - { label: "AI-ассистент", value: ai }
                  - { label: "Документы и медиа", value: docsMedia }
              - { label: "CTA — заголовок", name: cta_title, widget: string }
              - { label: "CTA — текст", name: cta_text, widget: text }
              - { label: "CTA — кнопка", name: cta_button, widget: string }
              - label: "Куда ведёт кнопка"
                name: cta_action
                widget: select
                default: "popup:calc"
                options:
                  - { label: "Попап · Демо", value: "popup:demo" }
                  - { label: "Попап · Пилот", value: "popup:pilot" }
                  - { label: "Попап · Точный расчёт", value: "popup:calc" }
                  - { label: "Попап · Консультация", value: "popup:consult" }
                  - { label: "Якорь · Форма на странице", value: "#zayavka" }
                  - { label: "Якорь · Калькулятор", value: "#instrument" }
                  - { label: "Якорь · Сравнение стека", value: "#stack" }
                  - { label: "Своя ссылка", value: "url" }
              - { label: "Своя ссылка", name: cta_url, widget: string, required: false, hint: "Если выбрано «Своя ссылка»: /blog, https://…" }
              - label: "Значения по умолчанию"
                name: defaults
                widget: object
                collapsed: true
                hint: "Пустое поле — значение из сценария"
                fields:
                  - { label: "Сотрудников", name: employees, widget: number, value_type: int, required: false }
                  - { label: "Часов в неделю на поиск", name: searchHours, widget: number, value_type: float, step: 0.5, required: false }
                  - { label: "Средняя зарплата, ₽", name: avgSalary, widget: number, value_type: int, required: false }

          - label: "Как начать — 3 шага"
            name: steps
            widget: object
            summary: "Шаги · {{fields.title}}"
            fields:
              - { label: "Заголовок", name: title, widget: string }
              - label: "Шаги"
                name: items
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { label: "Срок", name: time, widget: string }
                  - { label: "Заголовок", name: title, widget: string }
                  - { label: "Текст", name: text, widget: text }

          - label: "FAQ"
            name: faq
            widget: object
            summary: "FAQ · {{fields.title}}"
            fields:
              - { label: "Заголовок", name: title, widget: string }
              - { label: "Подпись", name: note, widget: string, required: false }
              - label: "Вопросы"
                name: items
                widget: list
                summary: "{{fields.q}}"
                fields:
                  - { label: "Вопрос", name: q, widget: string }
                  - { label: "Ответ", name: a, widget: text }

          - label: "Текст"
            name: text
            widget: object
            summary: "Текст · {{fields.title}}"
            fields:
              - { label: "Надзаголовок", name: kicker, widget: string, required: false }
              - { label: "Заголовок", name: title, widget: string, required: false }
              - { label: "Текст", name: body, widget: markdown }

          - label: "Форма заявки"
            name: form
            widget: object
            summary: "Форма · {{fields.title}}"
            fields:
              - { label: "Надзаголовок", name: kicker, widget: string }
              - { label: "Заголовок", name: title, widget: text }
              - { label: "Текст", name: text, widget: text }
              - { label: "Шаги", name: steps, widget: list, field: { label: "Шаг", name: step, widget: text } }
              - { label: "Плашки", name: chips, widget: list, required: false, field: { label: "Плашка", name: chip, widget: string } }
              - { label: "Сообщение после отправки", name: success, widget: text }

  # ================= Блог =================
  - name: blog
    label: Блог
    label_singular: статью
    folder: src/content/blog
    extension: md
    format: frontmatter
    create: true
    delete: true
    slug: "{{slug}}"
    summary: "{{title}} · {{date | date('DD.MM.YYYY')}}"
    preview_path: "/blog/{{slug}}"
    sortable_fields: [date, title]
    view_filters:
      - { label: "Черновики", field: draft, pattern: true }
    fields:
      - { label: "Заголовок", name: title, widget: string }
      - { label: "Анонс", name: description, widget: text, hint: "1–2 предложения. Уходит в карточку статьи и description для поиска" }
      - { label: "Дата", name: date, widget: datetime, time_format: false, date_format: "DD.MM.YYYY", format: "YYYY-MM-DD" }
      - { label: "Обложка", name: cover, widget: image, required: false, hint: "16:9, от 1600 px по ширине" }
      - { label: "Теги", name: tags, widget: list, required: false, field: { label: "Тег", name: tag, widget: string } }
      - { label: "Автор", name: author, widget: string, default: "Компо Софт" }
      - { label: "Черновик", name: draft, widget: boolean, default: true, hint: "Снимите отметку, чтобы опубликовать" }
      - { label: "Текст статьи", name: body, widget: markdown }

  # ================= Общие блоки =================
  - name: site
    label: Общие блоки
    files:
      - name: site
        label: Хедер, футер и контакты
        file: src/content/site.json
        fields:
          - { label: "Телефон", name: phone, widget: string }
          - { label: "Телефон для ссылки", name: phone_href, widget: string, hint: "tel:88005007934" }
          - { label: "Email", name: email, widget: string }
          - { label: "Адрес приёма заявок", name: form_endpoint, widget: string, required: false, hint: "URL функции в Yandex Cloud" }
          - label: "Кнопка в хедере"
            name: header_cta
            widget: object
            fields:
              - { label: "Текст", name: label, widget: string }
              - label: "Куда ведёт"
                name: action
                widget: select
                default: "popup:consult"
                options:
                  - { label: "Попап · Демо", value: "popup:demo" }
                  - { label: "Попап · Пилот", value: "popup:pilot" }
                  - { label: "Попап · Точный расчёт", value: "popup:calc" }
                  - { label: "Попап · Консультация", value: "popup:consult" }
                  - { label: "Якорь · Форма на странице", value: "#zayavka" }
                  - { label: "Якорь · Калькулятор", value: "#instrument" }
                  - { label: "Якорь · Сравнение стека", value: "#stack" }
                  - { label: "Своя ссылка", value: "url" }
              - { label: "Своя ссылка", name: url, widget: string, required: false, hint: "Если выбрано «Своя ссылка»: /blog, https://…" }
          - label: "Попапы"
            name: popups
            widget: list
            summary: "{{fields.id}} · {{fields.title}}"
            hint: "Тематические попапы с формой заявки. Кнопка открывает попап по ссылке #popup:<id>"
            fields:
              - { label: "ID", name: id, widget: string, hint: "Латиницей: demo, pilot, calc, consult. Для новой темы — новый ID", pattern: ["^[a-z0-9-]+$", "Только латиница, цифры и дефис"] }
              - { label: "Надзаголовок", name: kicker, widget: string, required: false }
              - { label: "Заголовок", name: title, widget: string }
              - { label: "Текст", name: text, widget: text, required: false }
              - { label: "Название формы в заявке", name: form_name, widget: string, hint: "Так лид будет подписан в почте и CRM" }
              - { label: "Сообщение после отправки", name: success, widget: text }
          - label: "Блог"
            name: blog
            widget: object
            fields:
              - { label: "Заголовок раздела", name: title, widget: string }
              - { label: "Описание", name: description, widget: text }
          - label: "Меню · продукты"
            name: nav
            widget: list
            summary: "{{fields.label}}"
            hint: "Новая страница появится в меню, только если добавить её сюда"
            fields:
              - { label: "Пункт", name: label, widget: string }
              - { label: "Ссылка", name: href, widget: string }
          - label: "Меню · дополнительно"
            name: nav_extra
            widget: list
            summary: "{{fields.label}}"
            fields:
              - { label: "Пункт", name: label, widget: string }
              - { label: "Ссылка", name: href, widget: string }
          - label: "Подменю «О нас»"
            name: about
            widget: list
            summary: "{{fields.label}}"
            fields:
              - { label: "Пункт", name: label, widget: string }
              - { label: "Ссылка", name: href, widget: string }
              - { label: "Подпись", name: hint, widget: string }
          - label: "Футер · Другие продукты"
            name: products
            widget: list
            summary: "{{fields.label}}"
            fields:
              - { label: "Название", name: label, widget: string }
              - { label: "Ссылка", name: href, widget: string }
          - label: "Футер · Инструменты"
            name: tools
            widget: list
            summary: "{{fields.label}}"
            fields:
              - { label: "Название", name: label, widget: string }
              - { label: "Ссылка", name: href, widget: string }
          - { label: "Адреса", name: addresses, widget: list, field: { label: "Адрес", name: address, widget: text } }
          - label: "Реестры и награды"
            name: badges
            widget: list
            summary: "{{fields.label}}"
            fields:
              - { label: "Название", name: label, widget: string }
              - { label: "Ссылка", name: href, widget: string, required: false }
          - { label: "Политика обработки ПДн", name: privacy_url, widget: string }
          - { label: "Пользовательское соглашение", name: agreement_url, widget: string }
          - { label: "Согласие на обработку ПДн", name: consent_url, widget: string }
          - { label: "Юридическая информация", name: legal, widget: list, field: { label: "Строка", name: line, widget: text } }
