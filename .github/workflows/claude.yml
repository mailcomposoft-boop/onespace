name: Claude

# Claude вносит правки по задачам.
# Как пользоваться: в issue или комментарии к pull request напишите @claude и задачу словами.
# Claude создаст ветку, внесёт изменения и откроет pull request. В main сам не пишет.

on:
  issues:
    types: [opened, assigned]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Реагирует только на @claude и только от участников репозитория
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Зависимости — чтобы Claude мог собрать сайт и проверить, что ничего не сломал
      # (npm install, а не npm ci: package-lock.json в репозитории пока нет)
      - run: npm install --no-audit --no-fund

      - uses: anthropics/claude-code-action@v1
        with:
          # Подписка Claude (Pro/Max/Team): токен из `claude setup-token`
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Вместо подписки можно ключ API — тогда закомментируйте строку выше и раскомментируйте эту:
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --max-turns 40
            --allowedTools "Edit,Write,Read,Glob,Grep,Bash(npm run build),Bash(npm install),Bash(git:*)"
